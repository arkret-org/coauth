http:
  listeners:
  - name: web
    resources:
    - name: discovery
    - name: human
    - name: oauth
    - name: restapi
    - name: assets
    - name: health
    binds:
    - address: '127.0.0.1:7080'
    proxy_protocol: false
  trusted_proxies:
  - 192.168.0.0/16
  - 172.16.0.0/12
  - 10.0.0.0/10
  - 127.0.0.1/8
  - fd00::/8
  - ::1/128
  public_base_url: https://auth.local.host/
  issuer: https://auth.local.host/
  csp_html: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'"
clients:
- client_id: 01GFWR28C4KNE04WG3HKXB7C9R
  client_name: Inkson Dev
  client_auth_method: none
  redirect_uris:
  - http://127.0.0.1/auth/callback
  - http://localhost/auth/callback
database:
  uri: postgresql://postgres:root@localhost/coauth_dev
  max_connections: 10
  min_connections: 0
  connect_timeout: 30
  idle_timeout: 600
  max_lifetime: 1800
# email:
#   from: '"coauth" <coauth@arkret.org>'
#   reply_to: '"coauth" <coauth@arkret.org>'
#   provider:
#     type: smtp
#     mode: tls
#     hostname: smtp.gmail.com
#     port: 465
#     username: chris@arkret.org
#     password: PASSWORD
secrets:
  # Local development uses the same restart-persistent encrypted backend as
  # production. `just init-dev` creates the separately stored master key
  # idempotently; every local artifact stays below the gitignored `.local/`.
  backend: encrypted_file
  path: ./.local/keystore/coauth.v1
  master_key_file: ./.local/secrets/coauth-keystore-master-key

storage:
  backend: fs
  root: ./.local/media

sms:
  transport: blackhole
  # transport: twilio
  # account_sid: "ACxxxx"
  # auth_token: "your_auth_token"
  # from_number: "+1234567890"
  # transport: http_webhook
  # api_url: "https://your-sms-gateway.example.com/send"
  # api_key: "your_api_key"
  # from_number: "+1234567890"
account:
  password_registration_enabled: true
  registration_email_delivery_bypass_allowed: true
  registration_token_required: false
  bootstrap_admin_token: admin
passwords:
  enabled: true
  schemes:
  - version: 1
    algorithm: argon2id
  minimum_complexity: 3
rate_limiting:
  # Dev-only: registration/login/email limits raised far above production so
  # iterative local testing (repeated register + login from one IP) is not
  # throttled with `rate_limited`. Do NOT copy these values to production.
  registration:
    burst: 100000
    per_second: 100000
  login:
    per_ip:
      burst: 100000
      per_second: 100000
    per_account:
      burst: 100000
      per_second: 100000
  email_authentication:
    per_ip:
      burst: 100000
      per_second: 100000
    per_address:
      burst: 100000
      per_second: 100000
arkret:
  trust_domain: ak:trust_domain:local.host
  stations:
  - name: soland-dev
    endpoint: https://local.host/
    internal_authority_shared_secret: local-coauth-session-grant-introspection
    embedded_webvh_registration_bearer: local-soland-webvh-registration
    # The Station's own trust domain, as a registered fact of this entry
    # (service-http-binding.md 2.2.3). `arkret.trust_domain` above is coauth's
    # own; the internal channel binds the target's separately and fails closed
    # when it is missing rather than deriving it from the endpoint host.
    trust_domain: ak:trust_domain:local.host
  identity_registry:
    resolver: https://local.host/_arkret/root/identity/resolve
    proof_required_for_pairwise: false

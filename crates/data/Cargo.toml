[package]
name = "coauth-data"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Enable JSON Schema + salvo OpenAPI derives on the shared domain types
# (Circle capability grants). Backends turn this on so `#[salvo::endpoint]`
# can populate the OpenAPI document; pure clients leave it off to avoid
# pulling salvo + schemars.
schema = ["dep:schemars", "dep:salvo"]

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
base64ct = {workspace = true}
chrono = {workspace = true}
coauth-iana = {workspace = true}
coauth-jose = {workspace = true}
cokret-core = {workspace = true}
crc = {workspace = true}
diesel = {workspace = true}
diesel-async = {workspace = true}
diesel_migrations = {workspace = true}
futures-util = {workspace = true}
ipnetwork = {workspace = true}
language-tags = {workspace = true}
lettre = {workspace = true}
coauth-oauth-types = {workspace = true}
opentelemetry = {workspace = true}
opentelemetry-semantic-conventions = {workspace = true}
rand = {workspace = true}
rand_chacha = {workspace = true}
rand_core = {workspace = true}
regex = {workspace = true}
salvo = {workspace = true,optional = true}
schemars = {workspace = true,optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
serde_urlencoded = {workspace = true}
sha2 = {workspace = true}
subtle = {workspace = true}
thiserror = {workspace = true}
tokio = {workspace = true}
tracing = {workspace = true}
tracing-opentelemetry = {workspace = true}
ulid = {workspace = true}
url = {workspace = true}
uuid = {workspace = true}
woothee = {workspace = true}
soland-core = {workspace = true}

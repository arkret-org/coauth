[package]
name = "coauth-admin-types"
description = "Shared serde types for the coauth admin API surface, consumed by the coauth backend (server-side serialize) and by sodmin (client-side deserialize)."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Enable JSON Schema + salvo OpenAPI derives. Backends turn this on so
# `#[salvo::endpoint]` can populate the OpenAPI document; pure clients
# (e.g. sodmin) leave it off to avoid pulling salvo + schemars. The
# The storage-neutral domain enums enable matching schema derives.
schema = ["dep:schemars", "dep:salvo", "coauth-data-model/schema"]

[dependencies]
arkret-schema = {workspace = true}
arkret-identifiers = {workspace = true}
chrono = {workspace = true,features = ["serde"]}
coauth-data-model = {workspace = true}
arkret-models-collaboration = {workspace = true}
salvo = {workspace = true,optional = true}
schemars = {workspace = true,optional = true}
serde = {workspace = true,features = ["derive"]}
serde_json = {workspace = true}

[package]
name = "coauth-config"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "schema"
doc = false

[features]
docker = []
# `RuntimeOwningStationIdentity::fixture` installs a delegated owning
# Station identity without the trust preflight that normally authorises it.
# Gating it keeps that bypass out of a production build of this crate;
# consumers opt in from `[dev-dependencies]`.
test-support = []

[dependencies]
anyhow = { workspace = true }
# Arkret v1 SDK — lightweight typed-identifier validators. Used for the
# `ak:trust_domain:<scope>` wire-form check (`is_trust_domain`) so the
# config-side validation never drifts from the SDK. `default-features =
# false` keeps the optional `salvo` surface out of the config build.
arkret-identifiers = { workspace = true }
arkret-identity = { workspace = true }
arkret-keystore = { workspace = true, features = ["keystore-macos", "keystore-linux", "keystore-windows", "keystore-encrypted-file"] }
arkret-models-identity = { workspace = true }
arkret-wire = { workspace = true }
base64 = { workspace = true }
camino = { workspace = true }
chrono = { workspace = true }
coauth-email-types = { workspace = true }
coauth-iana = { workspace = true }
coauth-jose = { workspace = true }
coauth-keyring = { workspace = true }
figment = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
indoc = { workspace = true }
ipnetwork = { workspace = true }
pem-rfc7468 = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
rustls-pki-types = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

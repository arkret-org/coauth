[package]
name = "coauth-frontend"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# ULID's random generator uses getrandom 0.4; browser builds must select its
# Web Crypto backend explicitly.
getrandom = { workspace = true, features = ["wasm_js"] }

[dependencies]
arkret-locale = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["wasmbind"] }
coauth-account-types = { workspace = true }
dioxus = { workspace = true }
fluent-bundle = { workspace = true }
gloo-timers = { workspace = true }
js-sys = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
ulid.workspace = true
unic-langid = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["CredentialCreationOptions", "CredentialRequestOptions", "CredentialsContainer", "HtmlDocument", "Navigator", "NodeList", "PublicKeyCredential"] }
webauthn-rs-proto = { workspace = true, features = ["wasm"] }
zxcvbn = { workspace = true }

[lints]
workspace = true

[package]
name = "coauth-data-model"
description = "Storage-neutral domain models shared by coauth application and adapters."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
schema = ["dep:salvo", "dep:schemars"]

[dependencies]
arkret-models-collaboration = { workspace = true }
arkret-schema = { workspace = true }
arkret-wire = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
salvo = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true

[lints]
workspace = true

[dependencies]
# Email dependencies

# SMS dependencies
# The workspace pins uuid with only the `v7` feature; we need `v4` for the
# random Aliyun SignatureNonce, so declare it explicitly (matching the
# workspace version 1.23.1).
async-trait = {workspace = true}
base64 = {workspace = true}
chrono = {workspace = true}
coauth-templates = {workspace = true}
hex = {workspace = true}
hmac = {workspace = true}
lettre = {workspace = true}
reqwest = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha1 = {workspace = true}
sha2 = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}
url = {workspace = true}
uuid = {workspace = true,features = ["v4"]}

[dev-dependencies]
rustls = {workspace = true}
rustls-platform-verifier = {workspace = true}
tokio = {workspace = true}
wiremock = {workspace = true}

[package]
name = "coauth-storage-postgres"
description = "PostgreSQL storage adapter, Diesel schema, and migrations for coauth."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# `test_utils` is fixture material, not a runtime surface: it seeds and
# TRUNCATEs a database and signs an Account Authority receipt with a public
# seed. Gating it keeps both out of a production build of this crate.
test-support = ["dep:arkret-signatures"]

[dependencies]
anyhow = { workspace = true }
arkret-canonical = { workspace = true }
arkret-identifiers = { workspace = true, features = ["diesel"] }
arkret-identity = { workspace = true }
arkret-locale = { workspace = true }
arkret-models-collaboration = { workspace = true }
arkret-models-identity = { workspace = true }
arkret-signatures = { workspace = true, optional = true }
arkret-wire = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
coauth-account-types = { workspace = true }
coauth-data = { workspace = true }
coauth-iana = { workspace = true }
coauth-jose = { workspace = true }
coauth-oauth-types = { workspace = true }
crc = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
diesel_migrations = { workspace = true }
futures-util = { workspace = true }
ipnetwork = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
arkret-signatures = { workspace = true }
# Used by the `arkret_key_bridge` source-scan guard, which walks this
# crate's `src/` tree; the workspace clippy config disallows
# `std::path::Path` in favour of `camino::Utf8Path`.
camino = { workspace = true }
# Only the SDK generation is linked here, and only by tests: the Account
# Status fixture in `account_status`'s rollback test signs with it through
# `crate::arkret_key_bridge`. No production path in this crate touches
# Ed25519, so `ed25519-dalek` 2.x is not a dependency at all.
ed25519-dalek-3 = { workspace = true }

[lints]
workspace = true

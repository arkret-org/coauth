[package]
name = "coauth-account-types"
description = "Shared serde types for the coauth account UI API surface, consumed by the coauth backend and frontend."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
schema = ["dep:salvo"]

[dependencies]
salvo = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
# Passkey wire types carry the browser WebAuthn payloads
# (challenge/attestation/assertion) as opaque `serde_json::Value`.
serde_json = { workspace = true }
ulid = { workspace = true, features = ["serde"] }

[lints]
workspace = true

# Integration stack: Postgres + coauth (+ optional soland/sodmin).
#
# This compose is intended for local bring-up smoke / e2e harness work; it
# deliberately keeps secrets, ports, and images close to defaults so that
# `scripts/integration-up.sh` and `scripts/integration-smoke.sh` can hit each
# service's `/health` endpoint without bespoke configuration.
#
# Image strategy:
#   - coauth : built from the local Dockerfile (this repository). The runtime
#              base is gcr.io/distroless/cc-debian12:nonroot, which has NO
#              shell and NO wget/curl. Healthchecks therefore call the
#              `coauth healthcheck` subcommand directly via CMD (not
#              CMD-SHELL) — the binary issues an HTTP probe to the
#              configured /health listener and exits 0 on 200.
#   - soland / sodmin : pulled by tag. No `:dev` tags are published
#              yet, so these services are gated behind profiles. Override
#              with the matching `*_IMAGE` env var when iterating against
#              locally-built images, e.g.
#                  SOLAND_IMAGE=soland:dev SODMIN_IMAGE=sodmin:dev \
#                      docker compose -f docker-compose.integration.yaml \
#                          --profile downstream up
#
# Profiles:
#   - default       : postgres + coauth                  (always-runnable)
#   - downstream    : adds soland + sodmin               (requires :dev images)
#
# Config strategy:
#   The coauth container expects a config at /etc/coauth/config.yaml. The
#   `scripts/integration-up.sh` wrapper generates one via an ephemeral
#   `coauth config generate` invocation before bringing the stack up. The
#   generated file lives at conformance/test-config.yaml — gitignored so
#   secrets aren't committed.

services:
  postgres:
    image: postgres:16-alpine
    container_name: arkret-pg
    environment:
      POSTGRES_USER: arkret
      POSTGRES_PASSWORD: arkret
      POSTGRES_DB: arkret
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkret -d arkret"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  coauth:
    image: ${COAUTH_IMAGE:-coauth:dev}
    build:
      # The build context is the *parent* directory because the workspace
      # `Cargo.toml` references sibling crates via `../arkret-rust-sdk/...`
      # (path deps). Building with `context: .` would fail at
      # `cargo chef prepare` because the sibling crates would be missing
      # from the container's filesystem. We use the parent + an explicit
      # dockerfile path so both the coauth tree and arkret-rust-sdk
      # land under one root inside the build sandbox.
      context: ..
      dockerfile: coauth/Dockerfile
    container_name: arkret-coauth
    depends_on:
      postgres:
        condition: service_healthy
    # The runtime image is gcr.io/distroless/cc-debian12:nonroot — no shell,
    # no wget, no curl. We mount a minimal test config and let the binary
    # default subcommand (server) take over. The healthcheck below uses
    # `coauth healthcheck` which is shipped in the image specifically so
    # the distroless runtime doesn't need extra binaries.
    command: ["server", "--config", "/etc/coauth/config.yaml"]
    volumes:
      - ./conformance/test-config.yaml:/etc/coauth/config.yaml:ro
    environment:
      # Override only the DB URI so the same test config works against the
      # compose postgres without baking host-specific values into the file.
      COAUTH_DATABASE__URI: postgresql://arkret:arkret@postgres:5432/arkret
      COAUTH_CONFIG: /etc/coauth/config.yaml
      RUST_LOG: info
    ports:
      - "57080:7080"
    # `coauth healthcheck` reads the same config the server is using, picks
    # the listener that exposes the `health` resource, and probes loopback.
    # It exits 0 on 200 and non-zero otherwise — exactly what compose wants.
    healthcheck:
      test: ["CMD", "/usr/local/bin/coauth", "healthcheck", "--config", "/etc/coauth/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # soland / sodmin are gated behind `--profile downstream` because no
  # `:dev` tags are published yet. Bring them up with explicitly-built
  # local images via `SOLAND_IMAGE=soland:dev SODMIN_IMAGE=sodmin:dev
  # docker compose ... --profile downstream up`. The e2e harness is
  # 404-tolerant for these surfaces, so the default profile (coauth-only)
  # still exercises every wired path.
  soland:
    image: ${SOLAND_IMAGE:-soland:dev}
    container_name: arkret-soland
    profiles: ["downstream"]
    depends_on:
      coauth:
        condition: service_healthy
    environment:
      # soland reads `DATABASE_URL` (or `SOLAND_DATABASE_URL`) and
      # `SOLAND_BIND`; it has no coauth-issuer environment setting.
      DATABASE_URL: postgresql://arkret:arkret@postgres:5432/arkret
      SOLAND_BIND: 0.0.0.0:8698
      RUST_LOG: info
    ports:
      - "58008:8698"
    # Same distroless reasoning as coauth — assume soland ships its own
    # `healthcheck` subcommand. If a deployment uses a different image
    # without one, override via `SOLAND_HEALTHCHECK_CMD`.
    healthcheck:
      test: ["CMD", "/usr/local/bin/soland", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  sodmin:
    image: ${SODMIN_IMAGE:-sodmin:dev}
    container_name: arkret-sodmin
    profiles: ["downstream"]
    depends_on:
      coauth:
        condition: service_healthy
      soland:
        condition: service_healthy
    environment:
      SODMIN_BIND: 0.0.0.0:9090
      SODMIN_COAUTH_BASE: http://coauth:7080/
      SODMIN_SOLAND_BASE: http://soland:8008/
      RUST_LOG: info
    ports:
      - "59090:9090"
    healthcheck:
      test: ["CMD", "/usr/local/bin/sodmin", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  pgdata:

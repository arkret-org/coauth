# Minimal R3 example; production deploys should use Helm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coauth
  labels:
    app: coauth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coauth
  template:
    metadata:
      labels:
        app: coauth
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coauth
          image: ghcr.io/arkret/coauth:replace-with-immutable-release-tag
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 7080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: runtime-data
              mountPath: /var/lib/coauth/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

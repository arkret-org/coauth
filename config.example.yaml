# coauth example configuration — copy to config.local.yaml (gitignored) and fill in real values.
# All secret-bearing fields below use ${ENV_VAR} placeholders. Never commit a file with real values.
http:
  listeners:
  - name: web
    resources:
    - name: discovery
    - name: human
    - name: oauth
    - name: restapi
    - name: assets
    - name: health
    binds:
    - address: '127.0.0.1:8080'
    proxy_protocol: false
  trusted_proxies:
  - 192.168.0.0/16
  - 172.16.0.0/12
  - 10.0.0.0/8
  - 127.0.0.1/8
  - fd00::/8
  - ::1/128
  public_base: https://auth.local.host/
  issuer: https://auth.local.host/
  csp_html: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'"
clients:
- client_id: 01GFWR28C4KNE04WG3HKXB7C9R
  client_name: Example Client
  client_auth_method: none
  redirect_uris:
  - http://127.0.0.1/auth/callback
  - http://localhost/auth/callback
database:
  # postgresql://<user>:<password>@<host>/<db>
  uri: ${COAUTH_DATABASE_URI}
  max_connections: 10
  min_connections: 0
  connect_timeout: 30
  idle_timeout: 600
  max_lifetime: 1800
email:
  from: '"coauth" <noreply@example.org>'
  reply_to: '"coauth" <noreply@example.org>'
  provider:
    type: smtp
    mode: tls
    hostname: smtp.example.org
    port: 465
    username: ${COAUTH_SMTP_USERNAME}
    password: ${COAUTH_SMTP_PASSWORD}
secrets:
  # 32-byte hex encryption key (openssl rand -hex 32)
  encryption: ${COAUTH_SECRETS_ENCRYPTION_KEY}
  keys:
  # Provide RSA / EC PEM private keys via environment variables or a local-only
  # secrets file. Generate fresh keys with:
  #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048
  #   openssl ecparam -name prime256v1 -genkey -noout
  # NEVER commit real keys to git.
  - key: ${COAUTH_SIGNING_KEY_RSA_PEM}
  - key: ${COAUTH_SIGNING_KEY_ES256_PEM}
  - key: ${COAUTH_SIGNING_KEY_ES384_PEM}
  - key: ${COAUTH_SIGNING_KEY_ES256K_PEM}
sms:
  transport: blackhole
  # transport: twilio
  # account_sid: ${TWILIO_ACCOUNT_SID}
  # auth_token: ${TWILIO_AUTH_TOKEN}
  # from_number: "+1234567890"
account:
  password_registration_enabled: true
  registration_email_delivery_bypass_allowed: false
  registration_token_required: false
  # Optional first-admin bootstrap token. If no admin exists yet, entering this
  # token on the final registration step grants admin privileges to that user.
  bootstrap_admin_token: ${COAUTH_ACCOUNT__BOOTSTRAP_ADMIN_TOKEN}
passwords:
  enabled: true
  schemes:
  - version: 1
    algorithm: argon2id
  minimum_complexity: 3
cokret:
  # Principal DIDs default to did:webvh. did:web is only accepted when both
  # deployment_profile: personal_node and principal_method: did:web are set.
  deployment_profile: organization
  principal_method: did:webvh
  # Production deployments must use a real did:webvh service DID minted through
  # starid:
  #   coauth config service-did init --starid-url https://starid.example \
  #     --host auth.example.com --key-output service-did-keys.yaml
  service_did: did:webvh:z2dmjYwAPJzv5CZsnAzt8auVZRn1GfuxhpK2t3Q3K3rj4B1x:auth.local.host:webvh:service
  principal_server_url: https://local.host/
  # Deployment trust-domain identifier injected into Realm policy and the
  # server-describe document. Wire form: ck:trust_domain:<scope> where <scope>
  # matches [a-z0-9._:-]{1,128}. Changing it invalidates existing cross-signing
  # reset proofs (see README "Trust domain rotation"). When omitted, replay
  # protection fails closed.
  # trust_domain: ck:trust_domain:<scope>
  # Lifetime, in seconds, of the DPoP-bound Cokret session-grant JWTs returned
  # by the REST auth bridge login/exchange paths and rotated through
  # /_cokret/gate/account/session-grants/refresh. Default: 28800 (8h). The grant
  # is the device-session refresh credential; the access bearers minted from it
  # are short-lived (capped Principal-Server side), so a multi-hour grant gives a
  # normal working session without long-lived bearers. Range [60, 86400].
  session_grant_ttl: 28800
  # Keep false during rollout; set true in production after service signing
  # keys and JWKS publication are operational.
  audit_signature_fail_closed: false
  principal_servers:
  - name: soland-example
    audience: did:webvh:z2dmjYwAPJzv5CZsnAzt8auVZRn1GfuxhpK2t3Q3K3rj4B1x:local.host:webvh:service
    endpoint: https://local.host/
    did: did:webvh:z2dmjYwAPJzv5CZsnAzt8auVZRn1GfuxhpK2t3Q3K3rj4B1x:local.host:webvh:service
    session_grant_introspection_bearer: ${SOLAND_SESSION_GRANT_INTROSPECTION_BEARER}
    embedded_webvh_registration_bearer: ${SOLAND_WEBVH_REGISTRATION_BEARER}

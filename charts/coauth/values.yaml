# Default values for coauth.
# This file is intentionally minimal — production deployments should
# override the database URL secret, image tag, and resource limits.

replicaCount: 3

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/arkret/coauth
  tag: ""  # Defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9091

# Database connection. The chart does NOT package PostgreSQL — operators
# must provide an external (or sibling-chart) Postgres and reference the
# secret here.
database:
  urlSecret: coauth-db   # Secret containing key `url`
  urlSecretKey: url

config:
  # Inline config.yaml; mounted as a ConfigMap.
  # Replace with your own configuration.
  yaml: |
    http:
      listeners:
        - name: public
          resources:
            - name: discovery
            - name: human
            - name: oauth
            - name: restapi
            - name: assets
            - name: adminapi
            - name: health
          binds:
            - address: 0.0.0.0:8080

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: false
  ingressCidrs: []
  egress:
    postgresCidrs: []
    postgresPort: 5432
    oidcProviderCidrs: []
    oidcProviderPort: 443
    solandCidrs: []
    solandPort: 443
    dns:
      enabled: true
      namespaceSelector:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        k8s-app: kube-dns

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

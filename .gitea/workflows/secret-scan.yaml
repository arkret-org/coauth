name: Gitea Secret scan

# Runs gitleaks on every push (any branch) and every pull request so that
# a leaked credential is caught the moment it lands on a developer
# branch — not only after it reaches main. Closes circle-rollout P1.5.8.
on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitea-secret-scan-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-24.04

    steps:
      - name: Fetch repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so we catch secrets in any reachable commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

name: Gitea Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

concurrency:
  group: gitea-ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Verify Rust formatting
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Set up nightly Rust for rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Verify formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Set up Rust with Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore Cargo dependency cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: gitea-cargo-stable-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gitea-cargo-stable-v1-${{ runner.os }}-

      - name: Restore Clippy target cache
        uses: actions/cache@v3
        with:
          path: target/
          key: gitea-target-clippy-stable-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gitea-target-clippy-stable-v1-${{ runner.os }}-

      - name: Execute Clippy lints
        run: cargo clippy --workspace --tests --bins --lib -- -D warnings

  cargo-deny:
    name: Audit dependencies with cargo-deny
    runs-on: ubuntu-24.04

    env:
      RUSTC_WRAPPER: ""

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Audit with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.0.14
        with:
          rust-version: stable

  check-schema:
    name: Validate generated schemas
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo dependency cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: gitea-cargo-stable-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gitea-cargo-stable-v1-${{ runner.os }}-

      - name: Restore schema target cache
        uses: actions/cache@v3
        with:
          path: target/
          key: gitea-target-schema-stable-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gitea-target-schema-stable-v1-${{ runner.os }}-

      - name: Regenerate schemas
        run: sh ./misc/update.sh

      - name: Ensure working tree is clean
        run: |
          if ! [[ -z $(git status -s) ]]; then
            echo "::error title=Workspace is not clean::Please run 'sh ./misc/update.sh' (or 'pwsh -File ./misc/update.ps1' on Windows) and commit the changes"
            git diff
            exit 1
          fi

  compile-test-artifacts:
    name: Build nextest archive
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo dependency cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: gitea-cargo-stable-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gitea-cargo-stable-v1-${{ runner.os }}-

      - name: Restore nextest target cache
        uses: actions/cache@v3
        with:
          path: target/
          key: gitea-target-nextest-stable-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gitea-target-nextest-stable-v1-${{ runner.os }}-

      - name: Set up nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Compile and archive test binaries
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst

      - name: Upload nextest archive
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst

  test:
    name: Run partitioned Rust tests
    runs-on: ubuntu-24.04
    needs:
      - rustfmt
      - compile-test-artifacts
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]

    permissions:
      contents: read

    services:
      postgres:
        image: docker.io/library/postgres:15.3
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download nextest archive
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: nextest-archive
          path: .

      - name: Execute test partition
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/postgres
        run: |
          ~/.cargo/bin/cargo-nextest nextest run \
            --archive-file nextest-archive.tar.zst \
            --partition count:${{ matrix.partition }}/3

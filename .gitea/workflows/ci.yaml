name: Gitea Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  # Daily advisory sweep so newly disclosed CVEs surface even when nobody is
  # pushing. The cargo-deny job is the cheapest way to re-run it.
  schedule:
    - cron: "37 5 * * *"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

concurrency:
  group: gitea-ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Verify Rust formatting
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check out Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ gitea.repository_owner }}
          GITHUB_SERVER_URL: ${{ gitea.server_url }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk

      - name: Set up nightly Rust for rustfmt
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Verify formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check out Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ gitea.repository_owner }}
          GITHUB_SERVER_URL: ${{ gitea.server_url }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk

      - name: Set up Rust with Clippy
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: clippy

      - name: Restore Cargo dependency cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: gitea-cargo-stable-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gitea-cargo-stable-v1-${{ runner.os }}-

      - name: Restore Clippy target cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: target/
          key: gitea-target-clippy-stable-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gitea-target-clippy-stable-v1-${{ runner.os }}-

      - name: Execute Clippy lints
        run: cargo clippy --workspace --tests --bins --lib -- -D warnings

  typos:
    name: Spell-check sources with typos
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Install typos-cli
        run: cargo install typos-cli --locked

      - name: Run typos
        run: typos --config ./.typos.toml

  cargo-deny:
    name: Audit dependencies with cargo-deny
    runs-on: ubuntu-24.04

    env:
      RUSTC_WRAPPER: ""

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check out Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ gitea.repository_owner }}
          GITHUB_SERVER_URL: ${{ gitea.server_url }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk

      - name: Audit with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@76cd80eb775d7bbbd2d80292136d74d39e1b4918 # v2.0.14
        with:
          rust-version: stable

  compile-test-artifacts:
    name: Build nextest archive
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check out Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ gitea.repository_owner }}
          GITHUB_SERVER_URL: ${{ gitea.server_url }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Restore Cargo dependency cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: gitea-cargo-stable-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gitea-cargo-stable-v1-${{ runner.os }}-

      - name: Restore nextest target cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: target/
          key: gitea-target-nextest-stable-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gitea-target-nextest-stable-v1-${{ runner.os }}-

      - name: Set up nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-nextest

      - name: Compile and archive test binaries
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst

      - name: Upload nextest archive
        uses: christopherhx/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4 branch
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst

  test:
    name: Run partitioned Rust tests
    runs-on: ubuntu-24.04
    needs:
      - rustfmt
      - compile-test-artifacts
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]

    permissions:
      contents: read

    services:
      postgres:
        image: docker.io/library/postgres:15.3
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Fetch repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Set up nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-nextest

      - name: Download nextest archive
        uses: christopherhx/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7 # v4 branch
        with:
          name: nextest-archive
          path: .

      - name: Execute test partition
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/postgres
        run: |
          ~/.cargo/bin/cargo-nextest nextest run \
            --archive-file nextest-archive.tar.zst \
            --partition count:${{ matrix.partition }}/3

  # -- Final gate --

  tests-done:
    name: All checks passed
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - rustfmt
      - clippy
      - typos
      - cargo-deny
      - test

    steps:
      - uses: matrix-org/done-action@3409aa904e8a2aaf2220f09bc954d3d0b0a2ee67 # v3
        with:
          needs: ${{ toJSON(needs) }}

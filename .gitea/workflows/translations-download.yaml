name: Gitea Fetch Localazy Translations

on:
  workflow_dispatch:

jobs:
  fetch-translations:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Validate branch eligibility
        shell: bash
        run: |
          case "${{ gitea.ref_name }}" in
            main|release/v*)
              ;;
            *)
              echo "This workflow only supports main and release/v* branches."
              exit 1
              ;;
          esac

      - name: Fetch repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Prepare Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Localazy CLI
        run: npm install -g @localazy/cli

      - name: Derive Localazy branch identifier
        id: localazy-branch
        run: |
          echo "name=${{ gitea.ref_name }}" | sed 's#^name=release/#name=#' >> "$GITHUB_OUTPUT"

      - name: Pull translations from Localazy
        env:
          BRANCH: ${{ steps.localazy-branch.outputs.name }}
          LOCALAZY_WRITE_KEY: ${{ secrets.LOCALAZY_WRITE_KEY }}
        run: localazy download -w "$LOCALAZY_WRITE_KEY" -b "$BRANCH"

      - name: Commit and push translation updates
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No translation changes to commit."
            exit 0
          fi

          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@users.noreply"
          git add -A
          git commit -m "Translations updates"
          git push origin "HEAD:${{ gitea.ref_name }}"

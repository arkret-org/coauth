# Arkret v1 protocol SDK pieces — `arkret-core` exposes the typed
# identifiers + the `MoveSigner` trait + `UnsignedMove` builder, while
# `arkret-signatures` (with the `signer` feature) provides the production
# Ed25519 backend used by `anchor_pending_move`.
arkret-core = {version = "0.3.0",path = "../arkret-rust-sdk/crates/core",default-features = false}
arkret-hlc = {version = "0.3.0",path = "../arkret-rust-sdk/crates/hlc",default-features = false}
arkret-canonical = {version = "0.3.0",path = "../arkret-rust-sdk/crates/canonical",default-features = false}
arkret-models-collaboration = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-collaboration",default-features = false}
arkret-models-discovery = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-discovery",default-features = false}
arkret-models-identity = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-identity",default-features = false}
arkret-policy = {version = "0.3.0",path = "../arkret-rust-sdk/crates/policy",default-features = false}
arkret-schema = {version = "0.3.0",path = "../arkret-rust-sdk/crates/schema",default-features = false}
arkret-wire = {version = "0.3.0",path = "../arkret-rust-sdk/crates/wire",default-features = false}
arkret-http-client = {version = "0.3.0",path = "../arkret-rust-sdk/crates/http-client",default-features = false,features = ["tls-rustls"]}
arkret-crypto = {version = "0.3.0",path = "../arkret-rust-sdk/crates/crypto",default-features = false}
# Lightweight typed-identifier validators (no heavy transitive deps beyond
# what `arkret-core` already pulls in). Used by `coauth-config` for the
# `ak:trust_domain:<scope>` wire-form check so config and SDK never drift.
arkret-identifiers = {version = "0.3.0",path = "../arkret-rust-sdk/crates/identifiers",default-features = false}
arkret-egress-policy = {version = "0.3.0",path = "../arkret-rust-sdk/crates/egress-policy",default-features = false}
arkret-signatures = {version = "0.3.0",path = "../arkret-rust-sdk/crates/signatures",default-features = false,features = ["signer"]}
arkret-state = {version = "0.3.0",path = "../arkret-rust-sdk/crates/state",default-features = false}

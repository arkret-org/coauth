[workspace]
default-members = ["crates/cli"]
members = ["crates/*"]
exclude = [
    "crates/iana-codegen",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
authors = ["Arkret Team"]
edition = "2024"
rust-version = "1.96"
homepage = "https://arkret.dev/docs/"
repository = "https://github.com/arkret-org/coauth/"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
# Keep dead-code detection ON. The few genuinely-false positives (public API
# surface consumed via trait impls, build-time codegen, or conditional
# compilation) get a local `#[allow(dead_code)]` WITH a reason comment at the
# item; everything else the compiler flags should be deleted, not silenced.
dead_code = "warn"

[workspace.lints.clippy]
# We use groups as good defaults, but with a lower priority so that we can override them
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

str_to_string = "deny"
too_many_lines = "allow"

# Pedantic lints we explicitly opt out of as a matter of style: requiring
# `# Errors`/`# Panics` doc sections on every `Result`/may-panic helper is
# noise on internal APIs, and the cast/markdown/naming nags below produce
# more churn than insight in this codebase.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
similar_names = "allow"
struct_field_names = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
match_wildcard_for_single_variants = "allow"
match_same_arms = "allow"
unnecessary_wraps = "allow"
ref_option = "allow"
option_option = "allow"
unused_async = "allow"
used_underscore_binding = "allow"
missing_fields_in_debug = "allow"
format_push_string = "allow"
format_collect = "allow"
ignored_unit_patterns = "allow"
single_match_else = "allow"
manual_let_else = "allow"
if_not_else = "allow"
wildcard_imports = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"


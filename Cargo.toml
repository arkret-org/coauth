[workspace]
default-members = ["crates/cli"]
members = ["crates/*"]
exclude = [
    "crates/data-model",
    "crates/iana-codegen",
    "crates/storage",
    "crates/storage-pg",
]
resolver = "3"

[workspace.package]
version = "1.8.0"
authors = ["Meldry Team"]
edition = "2024"
homepage = "https://meldry.com/docs/"
repository = "https://github.com/meldry-com/coauth/"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# We use groups as good defaults, but with a lower priority so that we can override them
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

str_to_string = "deny"
too_many_lines = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.dependencies]

# Workspace crates
coauth = { path = "./crates/cli/", version = "=1.8.0" }
coauth-backend = { path = "./crates/backend/", version = "=1.8.0" }
coauth-config = { path = "./crates/config/", version = "=1.8.0" }
coauth-data = { path = "./crates/data/", version = "=1.8.0" }
coauth-messaging = { path = "./crates/messaging/", version = "=1.8.0" }
coauth-i18n = { path = "./crates/i18n/", version = "=1.8.0" }
coauth-i18n-scan = { path = "./crates/i18n-scan/", version = "=1.8.0" }
coauth-iana = { path = "./crates/iana/", version = "=1.8.0" }
coauth-iana-codegen = { path = "./crates/iana-codegen/", version = "=1.8.0" }
coauth-jose = { path = "./crates/jose/", version = "=1.8.0" }
coauth-keystore = { path = "./crates/keystore/", version = "=1.8.0" }
coauth-matrix = { path = "./crates/matrix/", version = "=1.8.0" }
coauth-matrix-palpo = { path = "./crates/matrix-palpo/", version = "=1.8.0" }
coauth-policy = { path = "./crates/policy/", version = "=1.8.0" }
coauth-tasks = { path = "./crates/tasks/", version = "=1.8.0" }
coauth-templates = { path = "./crates/templates/", version = "=1.8.0" }
oauth2-types = { path = "./crates/oauth2-types/", version = "=1.8.0" }

coauth-frontend = { path = "./crates/frontend/", version = "=1.8.0" }


# Integration-compose override.
#
# This file is loaded automatically by `docker compose` when present in the
# same directory as `docker-compose.integration.yaml`. The block below
# pins the integration image and removes the host-port publishes that the
# base file binds for interactive dev.
services:
  postgres:
    ports: !reset []
  coauth:
    image: coauth:dev-int
    volumes: !override []

# ----------------------------------------------------------------------

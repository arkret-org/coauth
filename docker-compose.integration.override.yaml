#      sourced from your secret manager (Vault, Doppler, AWS Secrets
#      Manager, sops-encrypted file, etc.).
#   2. Set image tags to a pinned semver, not `latest` / `dev-int`.
#   3. Set up an external Postgres (RDS, CloudSQL, …) — running
#      Postgres in a single-node compose stack is NOT a production
#      database.
#   4. Replace `restart: unless-stopped` with an orchestrator that
#      provides health-driven restart (systemd / Kubernetes / Nomad).
#   5. Front coauth with a TLS-terminating reverse proxy. Do NOT
#      expose port 8080 directly to the internet.

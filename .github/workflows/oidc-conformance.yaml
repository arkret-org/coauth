name: OIDC conformance suite

# Round 28: real CI invocation of the OpenID Foundation conformance harness
# (`openid/conformance-suite:latest`) against a live coauth fronted by
# Postgres via the integration docker-compose stack. The plan-based JSON
# configs in `conformance/` are mounted into the suite container and the
# basic-OP plan is executed; the JSON results are uploaded as a workflow
# artefact and the job fails red on any failed module.
#
# Round 25 left this as a scaffold; round 27 added plan configs +
# opt-in (`COAUTH_RUN_FULL_CONFORMANCE=1`) wrapper script. This iteration
# flips the env var on in CI so the suite actually runs.

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Conformance plan to run (basic-op | fapi2-baseline | mtls-baseline | all)"
        required: false
        default: "basic-op"
  schedule:
    # 04:13 UTC every Monday. Off-peak so the GH runner pool is mostly
    # idle and we get the cheapest possible runtime.
    - cron: "13 4 * * 1"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

concurrency:
  group: oidc-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: OIDC conformance run
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: oidc-conformance

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq
          fi

      - name: Pre-pull conformance suite image
        # Pull this concurrently with the cargo build to amortise the
        # 500MB image fetch — the layer cache is also reused across
        # weekly runs on the same hosted runner pool.
        run: docker pull openid/conformance-suite:latest

      - name: Preflight (catch obvious misconfig before the build)
        run: bash scripts/preflight-check.sh

      - name: Bring up integration stack (Postgres + coauth)
        env:
          # Build the coauth image locally inside compose; soland/sodmin
          # are profile-gated and not pulled here — only coauth is
          # exercised by the OIDC harness.
          COAUTH_IMAGE: coauth:ci
        run: |
          # integration-up.sh handles: build coauth → generate a fresh
          # test-config (with real signing keys) via an ephemeral coauth
          # container → compose up --wait postgres + coauth. soland/sodmin
          # remain off because they're behind --profile downstream.
          bash scripts/integration-up.sh

      - name: Wait for coauth /health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null -m 2 http://127.0.0.1:57080/health; then
              echo "coauth healthy after ${attempt}s"
              break
            fi
            sleep 1
            if [[ "${attempt}" -eq 30 ]]; then
              echo "coauth /health never returned 200" >&2
              docker compose -f docker-compose.integration.yaml logs coauth >&2 || true
              exit 3
            fi
          done

      - name: Run OIDC conformance suite
        env:
          COAUTH_RUN_FULL_CONFORMANCE: "1"
          # Override the discovery target so the harness reaches the
          # compose-published port instead of the default 8080. The
          # script reads this and rewrites the plan JSON into a temp
          # working copy before invoking the suite.
          COAUTH_BIND: "127.0.0.1:57080"
          # Skip the in-script "boot a fresh coauth-cli binary" path —
          # we already have a containerised coauth running.
          COAUTH_SKIP_BOOT: "1"
          CONFORMANCE_PLAN: ${{ github.event.inputs.plan || 'basic-op' }}
        run: |
          bash scripts/oidc-conformance.sh --plan "${CONFORMANCE_PLAN}"

      - name: Upload conformance results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: conformance-results
          path: target/conformance-results/
          if-no-files-found: ignore

      - name: Capture coauth logs on failure
        if: ${{ failure() }}
        run: |
          mkdir -p target/conformance-logs
          docker compose -f docker-compose.integration.yaml logs --no-color coauth   > target/conformance-logs/coauth.log   || true
          docker compose -f docker-compose.integration.yaml logs --no-color postgres > target/conformance-logs/postgres.log || true

      - name: Upload diagnostic logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: conformance-diagnostic-logs
          path: target/conformance-logs/
          if-no-files-found: ignore

      - name: Tear down integration stack
        if: ${{ always() }}
        run: docker compose -f docker-compose.integration.yaml down -v

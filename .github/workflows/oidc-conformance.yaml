name: OIDC conformance suite

# Full OpenID Foundation conformance is intentionally kept out of PRs.
# PR coverage remains smoke-only through the integration scripts; this
# workflow runs the full suite on a nightly schedule or on explicit
# workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Conformance plan to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - discovery
          - basic-op
          - fapi2-baseline
          - mtls-baseline
  schedule:
    # Nightly at 04:13 UTC.
    - cron: "13 4 * * *"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  COAUTH_CONFORMANCE_RESULTS: ${{ runner.temp }}/public-oidc-evidence
  COAUTH_CONFORMANCE_REF: 11999aad62ec292f36101410d9d5b761d44903ff

concurrency:
  group: oidc-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: OIDC conformance run
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coauth_conformance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      mongodb:
        image: mongo:6.0.13
        ports: ["27017:27017"]

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fetch Docker build source dependencies
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
          bash .ci/checkout-sibling.sh soland ../soland
          bash .ci/checkout-sibling.sh cotest ../cotest
          bash .ci/checkout-sibling.sh garth ../garth

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: oidc-conformance

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq
          fi

      - name: Check nightly conformance plans
        run: |
          set -euo pipefail
          for plan in \
            conformance/plan-basic-op.json \
            conformance/plan-fapi2-baseline.json \
            conformance/plan-mtls-baseline.json
          do
            test -f "${plan}"
            jq empty "${plan}"
          done

      - name: Checkout the official conformance suite
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: openid-certification/conformance-suite
          ref: ${{ env.COAUTH_CONFORMANCE_REF }}
          path: official-oidf-suite

      - name: Test the public evidence credential boundary
        run: python3 -m unittest discover -s conformance/tests

      - name: Apply the literal metadata member regression fix
        run: |
          test "$(git -C official-oidf-suite rev-parse HEAD)" = "$COAUTH_CONFORMANCE_REF"
          git -C official-oidf-suite apply --check "$GITHUB_WORKSPACE/conformance/official-suite-literal-metadata.patch"
          git -C official-oidf-suite apply "$GITHUB_WORKSPACE/conformance/official-suite-literal-metadata.patch"

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the official Java service
        working-directory: official-oidf-suite
        env:
          MAVEN_OPTS: -Xmx2g
        run: mvn -B package -DskipTests=true

      - name: Test official endpoint validation, including namespaced extensions
        working-directory: official-oidf-suite
        env:
          MAVEN_OPTS: -Xmx2g
        run: mvn -B -Dtest=CheckDiscEndpointAllEndpointsAreHttps_UnitTest test

      - name: Install official Python runner dependencies
        run: python3 -m pip install -r official-oidf-suite/scripts/requirements.txt pyyaml

      - name: Build Coauth
        run: |
          cargo build --locked --bin coauth

      - name: Run official conformance plans
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coauth_conformance
          COAUTH_CONFORMANCE_SOURCE: ${{ github.workspace }}/official-oidf-suite
          CONFORMANCE_PLAN: ${{ github.event.inputs.plan || 'all' }}
          COAUTH_CONFORMANCE_FULL_PLANS_JSON: ${{ secrets.COAUTH_CONFORMANCE_FULL_PLANS_JSON }}
        run: bash conformance/run-local-official-suite.sh

      - name: Preserve credential-free JUnit evidence
        if: ${{ always() }}
        run: >-
          python3 conformance/publish-evidence.py
          --junit official-oidf-suite/target/surefire-reports
          --output "$COAUTH_CONFORMANCE_RESULTS"

      - name: Upload conformance results
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: conformance-results
          path: ${{ env.COAUTH_CONFORMANCE_RESULTS }}
          if-no-files-found: ignore

name: Postgres lib-test gate

# a dedicated job that runs the `--lib` test suites against a real, migrated
# Postgres instance.
#
# Why a separate job from the existing `test` matrix in `ci.yaml`?
#
# * The `test` matrix runs `cargo nextest` against an *unmigrated*
#   Postgres (no `coauth database migrate` step), which means every
#   test that goes through `setup_test_pool()` builds a pool
#   successfully but every SQL query fails on the missing tables. Those
#   tests effectively only exercise their `Some(pool) = ... else
#   { return; }` early-return arm in CI.
#
# * This job migrates the database first, then runs the lib tests with
#   `DATABASE_URL` set, so the gate actually exercises the live PG path
#   on every PR.
#
# `coauth-backend`'s handler tests are covered here too: they are gated on
# BOTH `DATABASE_URL` and the `cedar` feature, so without this job that whole
# face is skipped silently. Cross-test isolation is provided by the
# `TestDatabase` guard (session-level `pg_advisory_lock` plus
# `TRUNCATE ... RESTART IDENTITY CASCADE`), so they run against one shared
# migrated database.

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: postgres-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lib-tests-with-postgres:
    name: Run lib tests against migrated Postgres
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_DB: arkret_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/arkret_test

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fetch Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
          bash .ci/checkout-sibling.sh soland ../soland
          bash .ci/checkout-sibling.sh cotest ../cotest
          bash .ci/checkout-sibling.sh garth ../garth
          bash .ci/checkout-sibling.sh arkret-spec ../arkret-spec

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Wait for Postgres to accept connections
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 1
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Generate ephemeral coauth config
        # The migrate command needs a config file pointing at the
        # service-container database. Build the smallest possible one
        # and override `database.uri` to the CI env var.
        run: |
          cargo run --locked --bin coauth -- config generate > config.ci.yaml
          sed -i "s|uri: postgresql://.*|uri: ${DATABASE_URL}|" config.ci.yaml

      - name: Apply database migrations
        run: cargo run --locked --bin coauth -- database -c config.ci.yaml migrate

      - name: Run a known-PG lib test against migrated Postgres
        # scope: prove that the
        # `setup_test_pool() -> Option<Pool>` gate actually fires under
        # CI — i.e., at least one of the 168 callsites runs its full
        # body instead of early-returning on `None`. We pick a single
        # representative test (`pg::user::tests::test_user_repo`)
        # that exercises the round-trip
        # add → exists → find → list → patch → terms path against the
        # real Postgres. The "1 passed" check below is the
        # load-bearing signal: if the gate were stuck on `None` the
        # output would say "0 passed; 0 failed" because the body
        # never ran.
        #
        # Future round: once `coauth-data` PG tests get per-test
        # schema isolation (none of them currently truncate state
        # between runs, so they collide on shared usernames like
        # `john` / `alice`), expand this to the full
        # `cargo test --workspace --locked --lib` invocation.
        run: |
          set -euo pipefail
          out=$(cargo test --locked --lib -p coauth-data \
            --no-fail-fast pg::user::tests::test_user_repo -- --exact 2>&1)
          echo "$out"
          if ! echo "$out" | grep -qE "test result: ok\\. 1 passed"; then
            echo "::error::Expected pg::user::tests::test_user_repo to pass with PG present (gate did not fire)" >&2
            exit 1
          fi

      - name: Run the backend lib tests against migrated Postgres with cedar
        # The load-bearing gate. These tests need `DATABASE_URL` *and*
        # `--features cedar` at the same time; missing either makes them
        # early-return, which is how this whole face rotted unnoticed.
        # `--no-fail-fast` so a failing target still reports a count instead of
        # aborting the run at the first failure.
        run: cargo test --locked --lib -p coauth-backend --features cedar --no-fail-fast

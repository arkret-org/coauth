name: Postgres lib-test gate

# Runs repository and backend lib tests against a real, migrated Postgres.
# The main CI test partitions also migrate their database; this gate adds
# Cedar-enabled handler coverage and an explicit repository-test selection.
# TestDatabase serializes shared database access with a session advisory lock
# and truncates application tables between cases.

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: postgres-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lib-tests-with-postgres:
    name: Run lib tests against migrated Postgres
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_DB: arkret_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/arkret_test

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fetch Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
          bash .ci/checkout-sibling.sh soland ../soland
          bash .ci/checkout-sibling.sh cotest ../cotest
          bash .ci/checkout-sibling.sh garth ../garth
          bash .ci/checkout-sibling.sh arkret-spec ../arkret-spec

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Wait for Postgres to accept connections
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 1
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Generate ephemeral coauth config
        # The migrate command needs a config file pointing at the
        # service-container database. Build the smallest possible one
        # and override `database.uri` to the CI env var.
        run: |
          cargo run --locked --bin coauth -- config generate > config.ci.yaml
          sed -i "s|uri: postgresql://.*|uri: ${DATABASE_URL}|" config.ci.yaml

      - name: Apply database migrations
        run: cargo run --locked --bin coauth -- database -c config.ci.yaml migrate

      - name: Run a known-PG lib test against migrated Postgres
        # The exact selection and count assert that this test still exists
        # in its current storage package. setup_test_pool fails when Postgres
        # is unavailable, so a passing case exercises the migrated database.
        run: |
          set -euo pipefail
          out=$(cargo test --locked --lib -p coauth-storage-postgres \
            --no-fail-fast user::tests::test_user_repo -- --exact 2>&1)
          echo "$out"
          if ! echo "$out" | grep -qE "test result: ok\\. 1 passed"; then
            echo "::error::Expected user::tests::test_user_repo to pass with PG present (gate did not fire)" >&2
            exit 1
          fi

      - name: Run the backend lib tests against migrated Postgres with cedar
        # The load-bearing gate. These tests need `DATABASE_URL` *and*
        # `--features cedar` at the same time; missing either makes them
        # early-return, which is how this whole face rotted unnoticed.
        # `--no-fail-fast` so a failing target still reports a count instead of
        # aborting the run at the first failure.
        run: cargo test --locked --lib -p coauth-backend --features cedar --no-fail-fast

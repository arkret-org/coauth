name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Rust checks --

  rustfmt:
    name: Verify Rust formatting
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Set up nightly Rust for rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Verify formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-24.04
    needs: [rustfmt]

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Set up Rust 1.93.0 with Clippy
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Execute Clippy lints
        run: |
          cargo clippy --workspace --tests --bins --lib -- -D warnings

  cargo-deny:
    name: Audit dependencies with cargo-deny
    runs-on: ubuntu-24.04

    env:
      # Disable sccache wrapper since this job does not install sccache
      RUSTC_WRAPPER: ""

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Audit with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.0.14
        with:
          rust-version: stable

  # -- Schema validation --

  check-schema:
    name: Validate generated schemas
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable
          rustup default stable

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Regenerate schemas
        run: sh ./misc/update.sh

      - name: Ensure working tree is clean
        run: |
          if ! [[ -z $(git status -s) ]]; then
            echo "::error title=Workspace is not clean::Please run 'sh ./misc/update.sh' (or 'pwsh -File ./misc/update.ps1' on Windows) and commit the changes"

            (
              echo '## Diff after running `sh ./misc/update.sh`:'
              echo
              echo '```diff'
              git diff
              echo '```'
            ) >> $GITHUB_STEP_SUMMARY

            exit 1
          fi

  # -- Test execution --

  compile-test-artifacts:
    name: Build nextest archive
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Compile and archive test binaries
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst

      - name: Store nextest archive
        uses: actions/upload-artifact@v7.0.0
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst

  test:
    name: Run partitioned Rust tests
    runs-on: ubuntu-24.04
    needs: [rustfmt, compile-test-artifacts]

    permissions:
      contents: read

    strategy:
      matrix:
        partition: [1, 2, 3]

    services:
      postgres:
        image: docker.io/library/postgres:15.3
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Retrieve nextest archive
        uses: actions/download-artifact@v8
        with:
          name: nextest-archive

      - name: Execute test partition
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/postgres
        run: |
          ~/.cargo/bin/cargo-nextest nextest run \
            --archive-file nextest-archive.tar.zst \
            --partition count:${{ matrix.partition }}/3

  # -- Final gate --

  tests-done:
    name: All checks passed
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - rustfmt
      - clippy
      - cargo-deny
      - check-schema
      - test

    steps:
      - uses: matrix-org/done-action@v3
        with:
          needs: ${{ toJSON(needs) }}

name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  # Daily advisory sweep so newly disclosed CVEs surface even when nobody is
  # pushing. The cargo-deny job is the cheapest way to re-run it.
  schedule:
    - cron: "37 5 * * *"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Rust checks --

  rustfmt:
    name: Verify Rust formatting
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fetch Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk

      - name: Set up nightly Rust for rustfmt
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Verify formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-24.04
    needs: [rustfmt]

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fetch Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk

      - name: Verify Rust version pins
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          expected = manifest["workspace"]["package"]["rust-version"]
          dockerfile = pathlib.Path("Dockerfile").read_text()
          workflow = pathlib.Path(".github/workflows/ci.yaml").read_text()
          docker_pin = re.search(r"^ARG RUSTC_VERSION=(\d+\.\d+)(?:\.\d+)?$", dockerfile, re.M)
          clippy_pin = re.search(r"^\s+toolchain: (\d+\.\d+)(?:\.\d+)?$", workflow, re.M)
          assert docker_pin and docker_pin.group(1) == expected, "Docker Rust pin differs from workspace MSRV"
          assert clippy_pin and clippy_pin.group(1) == expected, "Clippy Rust pin differs from workspace MSRV"
          PY

      - name: Set up Rust 1.97.0 with Clippy
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.97.0
          components: clippy

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Execute Clippy lints
        run: |
          cargo clippy --workspace --tests --bins --lib -- -D warnings

  typos:
    name: Spell-check sources with typos
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Run typos
        uses: crate-ci/typos@3bc303c295c081add5df4a4d52a1e117f2fb2dce # master
        with:
          config: ./.typos.toml

  cargo-deny:
    name: Audit dependencies with cargo-deny
    runs-on: ubuntu-24.04

    env:
      # Disable sccache wrapper since this job does not install sccache
      RUSTC_WRAPPER: ""

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fetch Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk

      - name: Audit with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@76cd80eb775d7bbbd2d80292136d74d39e1b4918 # v2.0.14
        with:
          rust-version: stable

  # -- Test execution --

  compile-test-artifacts:
    name: Build nextest archive
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fetch Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Set up nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-nextest

      - name: Compile and archive test binaries
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst

      - name: Store nextest archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst

  test:
    name: Run partitioned Rust tests
    runs-on: ubuntu-24.04
    needs: [rustfmt, compile-test-artifacts]

    permissions:
      contents: read

    strategy:
      matrix:
        partition: [1, 2, 3]

    services:
      postgres:
        image: docker.io/library/postgres:15.3
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Set up nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-nextest

      - name: Retrieve nextest archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nextest-archive

      - name: Execute test partition
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/postgres
        run: |
          ~/.cargo/bin/cargo-nextest nextest run \
            --archive-file nextest-archive.tar.zst \
            --partition count:${{ matrix.partition }}/3

  # -- Final gate --

  tests-done:
    name: All checks passed
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - rustfmt
      - clippy
      - typos
      - cargo-deny
      - test

    steps:
      - uses: matrix-org/done-action@3409aa904e8a2aaf2220f09bc954d3d0b0a2ee67 # v3
        with:
          needs: ${{ toJSON(needs) }}

name: Line endings

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  normalized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Verify canonical line endings
        shell: bash
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            echo "::error::Tracked text files are not normalized according to .gitattributes"
            exit 1
          fi


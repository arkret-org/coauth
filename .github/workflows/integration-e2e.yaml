name: Integration e2e        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down# bring up the docker-compose integration stack        run: bash scripts/integration-up.sh --down# (Postgres + coauth + soland + sodmin) and run the smoke + e2e harness        run: bash scripts/integration-up.sh --down# scripts against it. Captures container logs as artefacts on failure so        run: bash scripts/integration-up.sh --down# a red CI surface is debuggable without re-spinning the stack locally.        run: bash scripts/integration-up.sh --down#        run: bash scripts/integration-up.sh --down#   - integration-up.sh --wait : compose up -d --wait        run: bash scripts/integration-up.sh --down#   - integration-smoke.sh     : 200-OK probes on each /health        run: bash scripts/integration-up.sh --down#   - integration-e2e.sh       : 3 protocol-level scenarios (S1/S2/S3)        run: bash scripts/integration-up.sh --down#        run: bash scripts/integration-up.sh --down# The smoke + e2e scripts are 404-tolerant for surfaces that aren't        run: bash scripts/integration-up.sh --down# wired in the published soland/sodmin tags, so this job goes green        run: bash scripts/integration-up.sh --down# when the wire is reachable even if the higher-level scenarios skip.        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --downon:        run: bash scripts/integration-up.sh --down  push:        run: bash scripts/integration-up.sh --down    branches:        run: bash scripts/integration-up.sh --down      - main        run: bash scripts/integration-up.sh --down  pull_request:        run: bash scripts/integration-up.sh --down    branches:        run: bash scripts/integration-up.sh --down      - main        run: bash scripts/integration-up.sh --down  workflow_dispatch:        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --downenv:        run: bash scripts/integration-up.sh --down  CARGO_NET_GIT_FETCH_WITH_CLI: "true"        run: bash scripts/integration-up.sh --down  CARGO_TERM_COLOR: always        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --downconcurrency:        run: bash scripts/integration-up.sh --down  group: integration-e2e-${{ github.ref }}        run: bash scripts/integration-up.sh --down  cancel-in-progress: true        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --downjobs:        run: bash scripts/integration-up.sh --down  integration-e2e:        run: bash scripts/integration-up.sh --down    name: docker-compose integration e2e        run: bash scripts/integration-up.sh --down    runs-on: ubuntu-24.04        run: bash scripts/integration-up.sh --down    timeout-minutes: 30        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down    permissions:        run: bash scripts/integration-up.sh --down      contents: read        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down    steps:        run: bash scripts/integration-up.sh --down      - name: Fetch repository        run: bash scripts/integration-up.sh --down        uses: actions/checkout@v6        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down      - name: Install jq + curl        run: bash scripts/integration-up.sh --down        run: |        run: bash scripts/integration-up.sh --down          if ! command -v jq >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then        run: bash scripts/integration-up.sh --down            sudo apt-get update -y && sudo apt-get install -y jq curl        run: bash scripts/integration-up.sh --down          fi        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down      - name: Preflight (catch obvious misconfig before the 5min build)        run: bash scripts/integration-up.sh --down        run: bash scripts/preflight-check.sh        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down      - name: Bring up integration stack        run: bash scripts/integration-up.sh --down        env:        run: bash scripts/integration-up.sh --down          # Build coauth from the local Dockerfile (compose handles this        run: bash scripts/integration-up.sh --down          # via the build: clause). soland / sodmin are profile-gated        run: bash scripts/integration-up.sh --down          # (--profile downstream) and not pulled by default — the e2e        run: bash scripts/integration-up.sh --down          # harness is 404-tolerant for those surfaces and skips the        run: bash scripts/integration-up.sh --down          # corresponding scenarios when they aren't reachable.        run: bash scripts/integration-up.sh --down          COAUTH_IMAGE: coauth:ci        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down      - name: Run integration smoke (probes /health)        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-smoke.sh        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down      - name: Run integration e2e scenarios (S1 / S2 / S3)        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-e2e.sh        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down      - name: Capture container logs on failure        run: bash scripts/integration-up.sh --down        if: ${{ failure() }}        run: bash scripts/integration-up.sh --down        run: |        run: bash scripts/integration-up.sh --down          mkdir -p target/integration-logs        run: bash scripts/integration-up.sh --down          # The default profile only runs postgres + coauth; soland/sodmin        run: bash scripts/integration-up.sh --down          # only exist under --profile downstream, but we collect them        run: bash scripts/integration-up.sh --down          # unconditionally and tolerate misses so the same job is useful        run: bash scripts/integration-up.sh --down          # for both profile sets.        run: bash scripts/integration-up.sh --down          docker compose -f docker-compose.integration.yaml --profile downstream --profile did-webvh \        run: bash scripts/integration-up.sh --down            logs --no-color postgres > target/integration-logs/postgres.log 2>&1 || true        run: bash scripts/integration-up.sh --down          docker compose -f docker-compose.integration.yaml --profile downstream --profile did-webvh \        run: bash scripts/integration-up.sh --down            logs --no-color coauth   > target/integration-logs/coauth.log   2>&1 || true        run: bash scripts/integration-up.sh --down          docker compose -f docker-compose.integration.yaml --profile downstream --profile did-webvh \        run: bash scripts/integration-up.sh --down            logs --no-color soland   > target/integration-logs/soland.log   2>&1 || true        run: bash scripts/integration-up.sh --down          docker compose -f docker-compose.integration.yaml --profile downstream --profile did-webvh \        run: bash scripts/integration-up.sh --down            logs --no-color sodmin   > target/integration-logs/sodmin.log   2>&1 || true        run: bash scripts/integration-up.sh --down          docker compose -f docker-compose.integration.yaml --profile downstream --profile did-webvh \        run: bash scripts/integration-up.sh --down            ps > target/integration-logs/ps.txt 2>&1 || true        run: bash scripts/integration-up.sh --down          # Also dump the generated test config so we can see what coauth booted with.        run: bash scripts/integration-up.sh --down          cp conformance/test-config.yaml target/integration-logs/test-config.yaml 2>/dev/null || true        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down      - name: Upload integration diagnostic logs        run: bash scripts/integration-up.sh --down        if: ${{ failure() }}        run: bash scripts/integration-up.sh --down        uses: actions/upload-artifact@v7.0.0        run: bash scripts/integration-up.sh --down        with:        run: bash scripts/integration-up.sh --down          name: integration-e2e-logs        run: bash scripts/integration-up.sh --down          path: target/integration-logs/        run: bash scripts/integration-up.sh --down          if-no-files-found: ignore        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down      - name: Tear down integration stack        run: bash scripts/integration-up.sh --down        if: ${{ always() }}        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down        run: bash scripts/integration-up.sh --down
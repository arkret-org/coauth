name: Integration e2e

# bring up the docker-compose integration stack
# (Postgres + coauth + soland + sodmin) and run the smoke + e2e harness
# scripts against it. Captures container logs as artefacts on failure so
# a red CI surface is debuggable without re-spinning the stack locally.
#
#   - integration-up.sh --wait : compose up -d --wait
#   - integration-smoke.sh     : 200-OK probes on each /health
#   - integration-e2e.sh       : 3 protocol-level scenarios (S1/S2/S3)
#
# The smoke + e2e scripts are 404-tolerant for surfaces that aren't
# wired in the published soland/sodmin tags, so this job goes green
# when the wire is reachable even if the higher-level scenarios skip.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

concurrency:
  group: integration-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-e2e:
    name: docker-compose integration e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fetch Docker build source dependencies
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
          bash .ci/checkout-sibling.sh soland ../soland
          bash .ci/checkout-sibling.sh cotest ../cotest
          bash .ci/checkout-sibling.sh garth ../garth

      - name: Install jq + curl
        run: |
          if ! command -v jq >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq curl
          fi

      - name: Bring up integration stack
        env:
          # Build coauth from the local Dockerfile (compose handles this
          # via the build: clause). soland / sodmin are profile-gated
          # (--profile downstream) and not pulled by default — the e2e
          # harness is 404-tolerant for those surfaces and skips the
          # corresponding scenarios when they aren't reachable.
          COAUTH_IMAGE: coauth:ci
        run: bash scripts/integration-up.sh

      - name: Run integration smoke (probes /health)
        run: bash scripts/integration-smoke.sh

      - name: Run integration e2e scenarios (S1 / S2 / S3)
        run: bash scripts/integration-e2e.sh

      - name: Capture container logs on failure
        if: ${{ failure() }}
        run: |
          mkdir -p target/integration-logs
          # The default profile only runs postgres + coauth; soland/sodmin
          # only exist under --profile downstream, but we collect them
          # unconditionally and tolerate misses so the same job is useful
          # for both profile sets.
          docker compose -f docker-compose.integration.yaml --profile downstream --profile did-webvh \
            logs --no-color postgres > target/integration-logs/postgres.log 2>&1 || true
          docker compose -f docker-compose.integration.yaml --profile downstream --profile did-webvh \
            logs --no-color coauth   > target/integration-logs/coauth.log   2>&1 || true
          docker compose -f docker-compose.integration.yaml --profile downstream --profile did-webvh \
            logs --no-color soland   > target/integration-logs/soland.log   2>&1 || true
          docker compose -f docker-compose.integration.yaml --profile downstream --profile did-webvh \
            logs --no-color sodmin   > target/integration-logs/sodmin.log   2>&1 || true
          docker compose -f docker-compose.integration.yaml --profile downstream --profile did-webvh \
            ps > target/integration-logs/ps.txt 2>&1 || true
          # Also dump the generated test config so we can see what coauth booted with.
          cp conformance/test-config.yaml target/integration-logs/test-config.yaml 2>/dev/null || true

      - name: Upload integration diagnostic logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: integration-e2e-logs
          path: target/integration-logs/
          if-no-files-found: ignore

      - name: Tear down integration stack
        if: ${{ always() }}
        run: bash scripts/integration-up.sh --down

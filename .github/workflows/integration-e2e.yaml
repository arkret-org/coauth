name: Integration e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

concurrency:
  group: integration-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-e2e:
    name: canonical S1 / S2 / S3 business integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fetch canonical provisioning and protocol dependencies
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          for repository in arkret-rust-sdk arkret-spec coland cotest garth chime inkson floria; do
            bash .ci/checkout-sibling.sh "$repository" "../$repository"
          done

      - name: Set up Rust 1.98.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - name: Install frontend task runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.46.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install native and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config curl jq
          npm ci --prefix ../cotest/e2e
          cd ../cotest/e2e
          test "$(node_modules/.bin/esbuild --version)" = "0.28.2"
          printf '%s\n' "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          npx playwright install --with-deps chromium

      - name: Install canonical frontend tools
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Prepare canonical TLS and isolated deployment prerequisites
        run: bash ../cotest/scripts/prepare-linux-joint-e2e.sh setup

      - name: Validate business scenario types
        run: |
          node ../cotest/e2e/node_modules/typescript/bin/tsc --project scripts/integration/tsconfig.json
          node ../cotest/e2e/scripts/check-wire-type-ownership.mjs --project scripts/integration/tsconfig.json
          node --test scripts/integration/verify-results.test.mjs

      - name: Run accepted account, browser WebAuthn, and two-admin scenarios
        run: bash scripts/integration-up.sh --business -JointDir "${RUNNER_TEMP}/coauth-integration"

      - name: Upload business results and diagnostic logs
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coauth-business-integration
          path: |
            ${{ runner.temp }}/coauth-integration/coauth-integration/business-summary.json
            ${{ runner.temp }}/coauth-integration/coauth-integration/business-junit.xml
            ${{ runner.temp }}/coauth-integration/services/**/*.log
            ${{ runner.temp }}/coauth-integration/preflight*.json
          if-no-files-found: warn

      - name: Restore runner prerequisites
        if: ${{ always() }}
        run: bash ../cotest/scripts/prepare-linux-joint-e2e.sh restore

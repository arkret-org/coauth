name: Test Coverage Reports

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: Gather Rust coverage data
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"

    services:
      postgres:
        image: docker.io/library/postgres:15.3
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fetch Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          bash .ci/checkout-sibling.sh arkret-rust-sdk ../arkret-rust-sdk
          bash .ci/checkout-sibling.sh soland ../soland
          bash .ci/checkout-sibling.sh cotest ../cotest
          bash .ci/checkout-sibling.sh garth ../garth
          bash .ci/checkout-sibling.sh arkret-spec ../arkret-spec

      - name: Set up Rust with llvm-tools
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Set up grcov
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: grcov

      - name: Apply the current test database schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/postgres
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=on --file crates/storage-postgres/migrations/00000000000000_initial/up.sql

      - name: Execute tests with coverage instrumentation
        run: |
          cargo test --no-fail-fast --workspace
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/postgres
          LLVM_PROFILE_FILE: "cargo-test-%p-%m.profraw"
          RUSTFLAGS: "-Cinstrument-coverage --cfg tokio_unstable"

      - name: Produce grcov lcov report
        run: |
          mkdir -p target/coverage
          grcov . --binary-path ./target/debug/deps/ -s . -t lcov --branch --ignore-not-existing --ignore '../*' --ignore "/*" -o target/coverage/tests.lcov

      - name: Submit Rust coverage to codecov.io
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/*.lcov
          flags: unit

name: Fetch Localazy Translations

on:
  workflow_dispatch:

jobs:
  fetch-translations:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Validate branch eligibility
        if: ${{ github.ref_name != 'main' && !startsWith(github.ref_name, 'release/v') }}
        run: exit 1

      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Prepare Node environment
        uses: actions/setup-node@v6.1.0
        with:
          node-version: 24

      - name: Set up Localazy CLI
        run: npm install -g @localazy/cli

      - name: Derive Localazy branch identifier
        id: localazy-branch
        run: |
          # Strip the "release/" prefix when present; keep 'main' unchanged
          echo "name=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - name: Resolve Localazy write key
        id: localazy-write-key
        shell: bash
        env:
          LOCALAZY_WRITE_KEY: ${{ secrets.LOCALAZY_WRITE_KEY }}
        run: |
          write_key="$(
            printf '%s' "$LOCALAZY_WRITE_KEY" |
              tr -d '\r' |
              sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          )"

          if [ -n "$write_key" ]; then
            echo "::add-mask::$write_key"
            {
              echo "available=true"
              echo "value<<__LOCALAZY_WRITE_KEY__"
              echo "$write_key"
              echo "__LOCALAZY_WRITE_KEY__"
            } >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail when Localazy credentials are unavailable
        if: ${{ steps.localazy-write-key.outputs.available != 'true' }}
        run: |
          echo "::error::LOCALAZY_WRITE_KEY is missing or contains only whitespace."
          exit 1

      - name: Pull translations from Localazy
        run: localazy download -w "$LOCALAZY_WRITE_KEY" -b "$BRANCH"
        env:
          BRANCH: ${{ steps.localazy-branch.outputs.name }}
          LOCALAZY_WRITE_KEY: ${{ steps.localazy-write-key.outputs.value }}

      - name: Open pull request with translation updates
        id: translation-pr
        uses: peter-evans/create-pull-request@v8.1.0
        with:
          branch: actions/localazy-download/${{ steps.localazy-branch.outputs.name }}
          branch-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Translations updates
          delete-branch: true
          labels: |
            T-Task
            A-I18n
          sign-commits: true
          title: Translations updates for ${{ steps.localazy-branch.outputs.name }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Auto-merge the pull request
        if: steps.translation-pr.outputs.pull-request-operation == 'created'
        run: gh pr merge --merge --auto "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.translation-pr.outputs.pull-request-number }}

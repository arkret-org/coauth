name: Secret scan

# Runs gitleaks on every push (any branch) and every pull request so that
# a leaked credential is caught the moment it lands on a developer
# branch — not only after it reaches main. Closes circle-rollout P1.5.8.
on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-24.04

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Full history so we catch secrets in any reachable commit.
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        # The CLI is MIT-licensed; the organization-only Action wrapper needs
        # an additional license. Preserve the same scanner and history scope.
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan all reachable history
        run: gitleaks git --redact --config .gitleaks.toml --log-opts=--all

name: Build and Release Pipeline

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"

  workflow_dispatch:

  # Trigger on pull request label changes; only runs when 'Z-Build-Workflow' label is present
  pull_request:
    types: [labeled]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}
  BUILDCACHE: ghcr.io/${{ github.repository }}/buildcache

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # -- Version computation --

  compute-version:
    name: Derive version from git tags
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.label.name == 'Z-Build-Workflow'

    permissions:
      contents: read

    outputs:
      describe: ${{ steps.version-info.outputs.describe }}
      timestamp: ${{ steps.version-info.outputs.timestamp }}

    steps:
      - name: Fetch repository with full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Full clone required for accurate git describe output
          fetch-depth: 0

      - name: Extract version and commit timestamp
        id: version-info
        run: |
          echo "describe=$(git describe --tags --match 'v*.*.*' --always)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

  # -- Container image --

  prepare-image-build:
    name: Resolve container image tags
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.label.name == 'Z-Build-Workflow'

    outputs:
      regular_suffixes: ${{ steps.tags.outputs.regular_suffixes }}
      source_suffix: ${{ steps.tags.outputs.source_suffix }}

    permissions:
      contents: read

    steps:
      - name: Compute Docker tag suffixes
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          ref_name="${{ github.ref_name }}"
          ref_type="${{ github.ref_type }}"
          short_sha="${GITHUB_SHA:0:12}"
          safe_ref="${ref_name//\//-}"

          regular_suffixes=("sha-${short_sha}")

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_NUMBER:-}" ]; then
            regular_suffixes+=("pr-${PR_NUMBER}")
          else
            if [ "$ref_type" = "branch" ]; then
              regular_suffixes+=("$safe_ref")

              if [ "$safe_ref" = "main" ]; then
                regular_suffixes+=("latest")
              fi
            fi

            if [ "$ref_type" = "tag" ] && [[ "$ref_name" == v* ]]; then
              version="${ref_name#v}"
              regular_suffixes+=("$version")

              if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                major="${BASH_REMATCH[1]}"
                minor="${BASH_REMATCH[2]}"
                regular_suffixes+=("${major}.${minor}" "${major}" "latest")
              fi
            fi
          fi

          {
            echo "regular_suffixes<<EOF"
            printf "%s\n" "${regular_suffixes[@]}" | awk '!seen[$0]++'
            echo "EOF"
            echo "source_suffix=sha-${short_sha}"
          } >> "$GITHUB_OUTPUT"

  build-image-arch:
    name: Build and publish container image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'push' || github.event.label.name == 'Z-Build-Workflow'
    needs:
      - compute-version
      - prepare-image-build

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    env:
      VERGEN_GIT_DESCRIBE: ${{ needs.compute-version.outputs.describe }}
      SOURCE_DATE_EPOCH: ${{ needs.compute-version.outputs.timestamp }}

    steps:
      - name: Fetch repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: coauth

      - name: Fetch Arkret Rust SDK
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: |
          bash coauth/.ci/checkout-sibling.sh arkret-rust-sdk arkret-rust-sdk
          bash coauth/.ci/checkout-sibling.sh coland coland
          bash coauth/.ci/checkout-sibling.sh cotest cotest
          bash coauth/.ci/checkout-sibling.sh garth garth
          bash coauth/.ci/checkout-sibling.sh floria floria

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Authenticate with GitHub Container Registry
        if: github.server_url == 'https://github.com'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute per-architecture tags
        id: arch-tags
        env:
          FINAL_SUFFIXES: ${{ needs.prepare-image-build.outputs.regular_suffixes }}
        run: |
          set -euo pipefail

          release_tags=()
          primary_tag=""

          while IFS= read -r suffix; do
            [ -n "$suffix" ] || continue
            tag="${IMAGE}:${suffix}-${{ matrix.arch }}"
            release_tags+=("$tag")
            if [ -z "$primary_tag" ]; then
              primary_tag="$tag"
            fi
          done <<< "$FINAL_SUFFIXES"

          {
            echo "primary=$primary_tag"
            echo "release<<EOF"
            printf "%s\n" "${release_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release image for ${{ matrix.arch }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: coauth/Dockerfile
          build-contexts: |
            savfox=../savfox-ai/savfox
          platforms: ${{ matrix.platform }}
          pull: true
          push: ${{ github.server_url == 'https://github.com' }}
          load: ${{ github.server_url != 'https://github.com' }}
          provenance: ${{ github.server_url == 'https://github.com' && 'mode=max' || 'false' }}
          sbom: ${{ github.server_url == 'https://github.com' && 'true' || 'false' }}
          build-args: |
            VERGEN_GIT_DESCRIBE=${{ needs.compute-version.outputs.describe }}
          tags: ${{ steps.arch-tags.outputs.release }}
          cache-from: type=registry,ref=${{ env.BUILDCACHE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.BUILDCACHE }}:buildcache-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Smoke test release image for ${{ matrix.arch }}
        shell: bash
        env:
          RELEASE_TAGS: ${{ steps.arch-tags.outputs.release }}
        run: |
          set -euo pipefail

          image="$(printf '%s\n' "$RELEASE_TAGS" | sed '/^$/d' | head -n1)"
          if [ -z "$image" ]; then
            echo "No release image tag was produced" >&2
            exit 1
          fi

          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            docker pull "$image"
          fi
          docker run --rm "$image" --version

      - name: Scan release image with Trivy for ${{ matrix.arch }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.arch-tags.outputs.primary }}
          scan-type: image
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  build-image:
    name: Publish container image manifests
    runs-on: ubuntu-24.04
    if: github.server_url == 'https://github.com' && (github.event_name == 'push' || github.event.label.name == 'Z-Build-Workflow')
    needs:
      - prepare-image-build
      - build-image-arch

    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      tags_text: ${{ steps.publish.outputs.tags_text }}

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Set up Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release multi-arch manifests
        id: publish
        env:
          FINAL_SUFFIXES: ${{ needs.prepare-image-build.outputs.regular_suffixes }}
          SOURCE_SUFFIX: ${{ needs.prepare-image-build.outputs.source_suffix }}
        run: |
          set -euo pipefail

          args=()
          while IFS= read -r suffix; do
            [ -n "$suffix" ] || continue
            args+=("-t" "${IMAGE}:${suffix}")
          done <<< "$FINAL_SUFFIXES"

          docker buildx imagetools create \
            "${args[@]}" \
            "${IMAGE}:${SOURCE_SUFFIX}-amd64" \
            "${IMAGE}:${SOURCE_SUFFIX}-arm64"

          digest="$(docker buildx imagetools inspect "${IMAGE}:${SOURCE_SUFFIX}" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid manifest digest for ${IMAGE}:${SOURCE_SUFFIX}" >&2
            exit 1
          fi

          {
            echo "digest=$digest"
            echo "tags_text<<EOF"
            while IFS= read -r suffix; do
              [ -n "$suffix" ] || continue
              echo "${IMAGE}:${suffix}"
            done <<< "$FINAL_SUFFIXES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Cosign the published image
        if: |
          github.event_name != 'pull_request'
          && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')

        env:
          REGULAR_DIGEST: ${{ steps.publish.outputs.digest }}

        run: |-
          cosign sign --yes \
            "$IMAGE@$REGULAR_DIGEST"

  # -- Tagged release --

  release:
    name: Publish tagged release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-image
      - build-binaries
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify release checksums
        working-directory: release-assets
        run: sha256sum --check ./*.sha256


      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*
          generate_release_notes: true
          body: |
            ### Docker image

            Release image:

            - Digest:
              ```
              ${{ env.IMAGE }}@${{ needs.build-image.outputs.digest }}
              ```
            - Tags:
              ```
              ${{ needs.build-image.outputs.tags_text }}
              ```

  release-frontend:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'Z-Build-Workflow')
    permissions:
      contents: read
    name: Build frontend assets
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: arkret-org/coauth
    steps:
      - name: Checkout coauth
        uses: actions/checkout@v6
        with:
          path: arkret-org/coauth
      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-org/arkret-rust-sdk
          ref: db0f5b44dec117b6b316690650efd0adb3a0f990
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/coland
          path: arkret-org/coland
          ref: 3fe4095cee96a967e6cf3d634b45800e30601aa7
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout cotest
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/cotest
          path: arkret-org/cotest
          ref: 43be65ca573064454b158502badcd2039dc58657
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout garth
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/garth
          path: arkret-org/garth
          ref: 8cfc6775b84528ff75c1ce37e6f879bfb1bfaf33
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout floria
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/floria
          path: arkret-org/floria
          ref: 9d9ee6e5ebfef35bae56d9d79a8a23157486bccb
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout arkret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-org/arkret-spec
          ref: 8ae6fd0f14c630310a524e38b950b191918295e3
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout bridges
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/bridges
          path: arkret-org/bridges
          ref: c3f9d8e51eddf63690fa083a493125dafdc86dae
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout savfox
        uses: actions/checkout@v6
        with:
          repository: savfox-ai/savfox
          path: savfox-ai/savfox
          ref: 30718f036341f22acb7cca1e35accee069a5d74a
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-org/coauth
          key: release-frontend
      - name: Install frontend tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build frontend
        run: dx build -p coauth-frontend --release --debug-symbols false --locked
      - name: Locate frontend assets
        shell: bash
        run: |
          target_dir=$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          test -f "$target_dir/dx/coauth-frontend/release/web/public/index.html"
          cp -R "$target_dir/dx/coauth-frontend/release/web/public" frontend-dist
      - uses: actions/upload-artifact@v4
        with:
          name: coauth-frontend
          path: arkret-org/coauth/frontend-dist/
          if-no-files-found: error

  build-binaries:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'Z-Build-Workflow')
    permissions:
      contents: read
    name: Build (${{ matrix.target }})
    needs: release-frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: arkret-org/coauth
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos
    steps:
      - name: Checkout coauth
        uses: actions/checkout@v6
        with:
          path: arkret-org/coauth
      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-org/arkret-rust-sdk
          ref: db0f5b44dec117b6b316690650efd0adb3a0f990
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/coland
          path: arkret-org/coland
          ref: 3fe4095cee96a967e6cf3d634b45800e30601aa7
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout cotest
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/cotest
          path: arkret-org/cotest
          ref: 43be65ca573064454b158502badcd2039dc58657
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout garth
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/garth
          path: arkret-org/garth
          ref: 8cfc6775b84528ff75c1ce37e6f879bfb1bfaf33
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout floria
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/floria
          path: arkret-org/floria
          ref: 9d9ee6e5ebfef35bae56d9d79a8a23157486bccb
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout arkret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-org/arkret-spec
          ref: 8ae6fd0f14c630310a524e38b950b191918295e3
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout bridges
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/bridges
          path: arkret-org/bridges
          ref: c3f9d8e51eddf63690fa083a493125dafdc86dae
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout savfox
        uses: actions/checkout@v6
        with:
          repository: savfox-ai/savfox
          path: savfox-ai/savfox
          ref: 30718f036341f22acb7cca1e35accee069a5d74a
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake ninja-build nasm
      - name: Configure static Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.ci/configure-windows-openssl.ps1
      - name: Configure macOS OpenSSL
        if: runner.os == 'macOS'
        shell: bash
        run: |
          root=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$root" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-org/coauth
          key: release-${{ matrix.target }}
      - uses: actions/download-artifact@v5
        with:
          name: coauth-frontend
          path: arkret-org/coauth/frontend-dist
      - name: Build release executables
        run: cargo build --release --locked --target ${{ matrix.target }} -p coauth -p coauth-keystore-keygen
      - name: Package release
        run: python .ci/package-release.py --target ${{ matrix.target }} --binary coauth --binary coauth-keystore-keygen --resource templates --resource translations --resource policies --resource config.example.yaml --resource frontend-dist=dist
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: arkret-org/coauth/release-assets/*
          if-no-files-found: error

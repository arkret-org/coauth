name: Build and Release Pipeline

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"

  workflow_dispatch:

  # Trigger on pull request label changes; only runs when 'Z-Build-Workflow' label is present
  pull_request:
    types: [labeled]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}
  BUILDCACHE: ghcr.io/${{ github.repository }}/buildcache

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build-image:
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets:
      CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}

  # -- Tagged release --

  release:
    name: Publish tagged release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-image
      - build-binaries
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify release checksums
        working-directory: release-assets
        run: sha256sum --check ./*.sha256


      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*
          generate_release_notes: true
          body: |
            ### Docker image

            Release image:

            - Digest:
              ```
              ${{ env.IMAGE }}@${{ needs.build-image.outputs.digest }}
              ```
            - Tags:
              ```
              ${{ needs.build-image.outputs.tags_text }}
              ```

  release-frontend:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'Z-Build-Workflow')
    permissions:
      contents: read
    name: Build frontend assets
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: arkret-org/coauth
    steps:
      - name: Checkout coauth
        uses: actions/checkout@v6
        with:
          path: arkret-org/coauth
      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-org/arkret-rust-sdk
          ref: 5a2d1665e1831ff6e6cefe8a0b09a4d37989b611
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/coland
          path: arkret-org/coland
          ref: 3cdc2265f5134b7f7c53b563474c58cdc0070d06
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout cotest
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/cotest
          path: arkret-org/cotest
          ref: 6014fd04077aeca6a5f5f5e0dc5e7f84c9a07ec0
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout garth
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/garth
          path: arkret-org/garth
          ref: 960e007b4905f91b2ffc52ccf91db0b3cf5ca44d
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout floria
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/floria
          path: arkret-org/floria
          ref: 74cdcef3be19397ff7b813779c3e1ec734ed487b
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout arkret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-org/arkret-spec
          ref: fa57d06e1aec58970e588d503621e65ba3445a32
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout bridges
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/bridges
          path: arkret-org/bridges
          ref: ffc924755307dd76a092c36aedb9c7b464539d9f
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout savfox
        uses: actions/checkout@v6
        with:
          repository: savfox-ai/savfox
          path: savfox-ai/savfox
          ref: 05f25d778e9bf90afde4240da9aa2179ec8e0fff
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-org/coauth
          key: release-frontend
      - name: Install frontend tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          python3 scripts/install-wasm-bindgen.py
      - name: Build frontend
        run: python3 scripts/build-frontend.py --release --out-dir frontend-dist
      - name: Locate frontend assets
        shell: bash
        run: |
          test -f frontend-dist/index.html
          test -f frontend-dist/assets/pkg/coauth_frontend.js
          test -f frontend-dist/assets/pkg/coauth_frontend_bg.wasm
          test -f frontend-dist/assets/sapid.css
          test -f frontend-dist/ui-build-info.json
      - name: Set up frontend browser checks
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frontend browser checks
        run: |
          npm ci --prefix crates/frontend
          npm exec --prefix crates/frontend -- playwright install --with-deps chromium
      - name: Verify the freshly built frontend
        env:
          COAUTH_TEST_URL: http://127.0.0.1:4183
          COAUTH_BROWSER_CHANNEL: chromium
          COAUTH_TEST_ARTIFACTS: ${{ runner.temp }}/coauth-frontend-checks
        shell: bash
        run: |
          python3 scripts/serve-frontend.py --assets-dir frontend-dist --port 4183 > "${RUNNER_TEMP}/coauth-frontend-serve.log" 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 150); do
            kill -0 "$frontend_pid" || exit 1
            if curl --fail --silent "${COAUTH_TEST_URL}/ui-build-info.json" -o "${RUNNER_TEMP}/coauth-frontend-served.json" && cmp -s frontend-dist/ui-build-info.json "${RUNNER_TEMP}/coauth-frontend-served.json"; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1
          npm test --prefix crates/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: coauth-frontend
          path: arkret-org/coauth/frontend-dist/
          if-no-files-found: error

  build-binaries:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'Z-Build-Workflow')
    permissions:
      contents: read
    name: Build (${{ matrix.target }})
    needs: release-frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: arkret-org/coauth
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos
    steps:
      - name: Checkout coauth
        uses: actions/checkout@v6
        with:
          path: arkret-org/coauth
      - name: Checkout arkret-rust-sdk
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-org/arkret-rust-sdk
          ref: 5a2d1665e1831ff6e6cefe8a0b09a4d37989b611
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/coland
          path: arkret-org/coland
          ref: 3cdc2265f5134b7f7c53b563474c58cdc0070d06
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout cotest
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/cotest
          path: arkret-org/cotest
          ref: 6014fd04077aeca6a5f5f5e0dc5e7f84c9a07ec0
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout garth
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/garth
          path: arkret-org/garth
          ref: 960e007b4905f91b2ffc52ccf91db0b3cf5ca44d
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout floria
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/floria
          path: arkret-org/floria
          ref: 74cdcef3be19397ff7b813779c3e1ec734ed487b
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout arkret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-org/arkret-spec
          ref: fa57d06e1aec58970e588d503621e65ba3445a32
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout bridges
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/bridges
          path: arkret-org/bridges
          ref: ffc924755307dd76a092c36aedb9c7b464539d9f
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Checkout savfox
        uses: actions/checkout@v6
        with:
          repository: savfox-ai/savfox
          path: savfox-ai/savfox
          ref: 05f25d778e9bf90afde4240da9aa2179ec8e0fff
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake ninja-build nasm
      - name: Configure static Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.ci/configure-windows-openssl.ps1
      - name: Configure macOS OpenSSL
        if: runner.os == 'macOS'
        shell: bash
        run: |
          root=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$root" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-org/coauth
          key: release-${{ matrix.target }}
      - uses: actions/download-artifact@v5
        with:
          name: coauth-frontend
          path: arkret-org/coauth/frontend-dist
      - name: Build release executables
        run: cargo build --release --locked --target ${{ matrix.target }} -p coauth -p coauth-keystore-keygen
      - name: Package release
        run: python .ci/package-release.py --target ${{ matrix.target }} --binary coauth --binary coauth-keystore-keygen --resource templates --resource translations --resource policies --resource config.example.yaml --resource frontend-dist=dist
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: arkret-org/coauth/release-assets/*
          if-no-files-found: error
